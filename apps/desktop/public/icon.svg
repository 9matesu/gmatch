<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- gMatch brand mark: rounded-edge black square (squircle), lowercase g +
       capital M in Helvetica (falls back to Arial), tight tracking, flat
       monochrome — Apple-style. Vertically centered for the g's descender. -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="#000000"/>
  <text x="256" y="330" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="232" font-weight="500" letter-spacing="-8" fill="#FFFFFF">gM</text>
</svg>
