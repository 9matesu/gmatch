<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>gMatch</title>
    <link rel="icon" href="/icon.png" type="image/png" />
    <!--
      The brand face is registered here, before the bundle, so the static boot
      shell paints in Switzer at the click (no FOUT, no system-font flash). The
      same file is referenced by globals.css @font-face for the app; the browser
      downloads it once. License: public/legal/ITF-FFL.txt.
    -->
    <link rel="preload" href="/fonts/switzer-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Switzer";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/switzer-latin.woff2") format("woff2");
      }
    </style>
    <!--
      The first paint is a static shell, not a blank page: it is inline CSS in
      the HTML document, so it renders before the bundle is even requested (the
      user sees something at the click, not at hydration). The app removes #boot
      once the feed is ready. No JS is required to draw it.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6, 24px);
        background: var(--color-surface-canvas, #09090b);
        color: var(--color-retro-fg, #fafafa);
        font-family: "Switzer", -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* One authored entrance for the whole lockup, not one per element. The
         durations/easing are the app's motion tokens; the inline keyframe is
         here because this shell paints before globals.css is even requested. */
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #boot .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-6, 24px);
        text-align: center;
        animation: boot-rise var(--motion-duration-enter, 300ms)
          var(--motion-ease-enter, cubic-bezier(0.16, 1, 0.3, 1)) both;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-stage { animation: none; }
      }
      /* Static twin of ui/Brand.tsx: before the bundle exists we cannot import
         the component, so the splash mirrors the LOGO token NAMES (with the
         same values as fallback) and the SAME shipped /icon.png mark. No baked
         wordmark. */
      #boot .brand-lockup {
        display: inline-flex;
        align-items: center;
        gap: var(--logo-gap, 0.5rem);
        min-width: var(--logo-min-width, 5rem);
        padding: var(--logo-clear-space, 0.375rem);
      }
      #boot .brand-mark {
        display: block;
        flex-shrink: 0;
        width: var(--logo-mark-size-hero, 3.5rem);
        height: var(--logo-mark-size-hero, 3.5rem);
        min-width: var(--logo-mark-min-size, 1rem);
        object-fit: contain;
        /* icon.png is the shipped 512px app icon (black squircle, white "gM").
           invert keeps BOTH halves (white squircle, black gM) on the dark
           splash; brightness(0) collapsed it into a plain white square. */
        filter: invert(1);
      }
      html.boot-light #boot .brand-mark {
        filter: none;
      }
      #boot .brand-word {
        font-size: var(--text-brand, 2rem);
        font-weight: var(--weight-brand, 900);
        letter-spacing: -0.025em;
      }
      /* The live status line: one short label that names what boot is actually
         waiting on (node, identity, feed). One hairline above it gives the
         label a composed anchor instead of floating in an empty field. No
         progress bar and no timer — the bundle updates this text; nothing is
         faked or delayed. */
      #boot .boot-status {
        margin: 0;
        min-width: var(--boot-status-width, 14rem);
        padding-top: var(--space-4, 16px);
        border-top: 1px solid var(--color-edge, #27272a);
        font-family: "Switzer", -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: var(--text-status, 0.9375rem);
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--color-retro-body, #d4d4d8);
      }
      /* Light theme: the shell must not flash white-on-white either way. The
         theme is known before the bundle loads (it lives in localStorage). */
      html.boot-light #boot {
        background: #f2f2f4;
        color: #18181b;
      }
      html.boot-light #boot .boot-status {
        color: var(--color-retro-muted, #71717a);
      }
    </style>
    <script>
      // Runs before the first paint: pick the theme from the saved settings so
      // the shell matches the app that is about to appear.
      try {
        var raw = localStorage.getItem('goonmatch-settings');
        var theme = raw ? (JSON.parse(raw).theme || 'dark') : 'dark';
        if (theme === 'light') document.documentElement.className = 'boot-light';
      } catch (e) { /* private mode: dark is the safe default */ }
      // Failsafe only: if the bundle never signals readiness (a crash, a module
      // that failed to load), lift the cover rather than trapping the user on a
      // splash forever. The normal path removes #boot the moment the feed lands,
      // so this never fires in a healthy boot — it is not a delay.
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b) b.remove();
      }, 12000);
    </script>
  </head>
  <body class="min-h-screen bg-retro-bg text-retro-fg font-sans flex flex-col selection:bg-retro-accent/20 selection:text-retro-fg">
    <div id="root"></div>
    <div id="boot">
      <div class="boot-stage">
        <div class="brand-lockup">
          <img class="brand-mark" src="/icon.png" alt="" aria-hidden="true" />
          <span class="brand-word">gMatch</span>
        </div>
        <p id="boot-status" class="boot-status" role="status" aria-live="polite">Starting the node…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
