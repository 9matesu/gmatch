<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>gMatch</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      The first paint is a static shell, not a blank page: it is inline CSS in
      the HTML document, so it renders before the bundle is even requested (the
      user sees something at the click, not at hydration). The app removes #boot
      once it has mounted. No JS is required to draw it.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #09090b;
        color: #fafafa;
        font-family: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #boot .logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: grayscale(1) brightness(0) invert(1);
      }
      html.boot-light #boot .logo {
        filter: grayscale(1) brightness(0);
      }
      #boot .word {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #boot .bar {
        width: 132px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #fafafa;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation: none; width: 100%; }
      }
      /* Light theme: the shell must not flash white-on-white either way. The
         theme is known before the bundle loads (it lives in localStorage). */
      html.boot-light #boot {
        background: #f2f2f4;
        color: #18181b;
      }
      html.boot-light #boot .bar {
        background: rgba(9, 9, 11, 0.12);
      }
    </style>
    <script>
      // Runs before the first paint: pick the theme from the saved settings so
      // the shell matches the app that is about to appear.
      try {
        var raw = localStorage.getItem('goonmatch-settings');
        var theme = raw ? (JSON.parse(raw).theme || 'dark') : 'dark';
        if (theme === 'light') document.documentElement.className = 'boot-light';
      } catch (e) { /* private mode: dark is the safe default */ }
    </script>
  </head>
  <body class="min-h-screen bg-retro-bg text-retro-fg font-sans flex flex-col selection:bg-retro-accent/20 selection:text-retro-fg">
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <img class="logo" src="/icon.svg" alt="" aria-hidden="true" />
      <div class="word">gMatch</div>
      <div class="bar" aria-hidden="true"></div>
      <span class="sr-only">Starting gMatch</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
