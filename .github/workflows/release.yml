name: Release
# Cross-platform portable builds (no central server — the bundle includes its
# own API). Windows publishes a single portable exe; Linux publishes an
# AppImage (the portable swap target) plus a deb for distro packaging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One bun install path on both runners (stage-api discovers it via
      # os.homedir() / PATH — no hardcoded drive letter or %APPDATA%).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (dev deps included)
        run: npm ci
      - name: Gate — lint / typecheck / unit tests
        env:
          NODE_ENV: test
        run: |
          npm run lint
          npm run typecheck
          npm run test --workspaces --if-present
          node apps/desktop/electron/updater-core.test.cjs
          node apps/desktop/electron/updater.test.cjs
      - name: Build portable artifacts (${{ matrix.os }})
        working-directory: apps/desktop
        env:
          NODE_ENV: test
        run: npm run ${{ matrix.script }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: apps/desktop/release/gMatch-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute hashes and write verification instructions
        run: node apps/desktop/scripts/release-manifest.cjs --dir dist --out dist/RELEASE_BODY.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gMatch-*
          body_path: dist/RELEASE_BODY.md
