name: Release
# 1.0 portable .exe (no central server — the bundle includes its own API).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install bun (needed by stage-api to copy bun.exe into the app)
        shell: pwsh
        run: |
          npm i -g --allow-scripts=bun bun
          echo "GMATCH_BUN_EXE=$(npm root -g | ForEach-Object { $_.Trim() })\bun\bin\bun.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install (NODE_ENV unset so dev deps install)
        run: npm ci
      - name: Gate — lint / typecheck / unit tests
        env:
          NODE_ENV: test
        run: |
          npm run lint
          npm run typecheck
          npm run test --workspaces --if-present
      - name: Build portable exe (icon + stage api + vite + electron-builder)
        working-directory: apps/desktop
        env:
          NODE_ENV: test
        run: npm run dist
      - name: Compute artifact SHA-256 (published in the release body + summary)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop -Filter "gMatch-*-portable.exe" -Recurse | Select-Object -First 1
          if (!$exe) {
            Write-Error "Portable exe not found in apps/desktop"
            exit 1
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "GMATCH_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GMATCH_EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GMATCH_EXE_NAME=$($exe.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Artifact integrity`n- ``$($exe.Name)`` SHA-256: ``$hash``"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.GMATCH_EXE_PATH }}
          append_body: true
          body: |
            **Verify before running (Windows PowerShell):**
            ~~~
            Get-FileHash "$env:USERPROFILE\Downloads\${{ env.GMATCH_EXE_NAME }}" -Algorithm SHA256
            ~~~
            Expected SHA-256: ``${{ env.GMATCH_SHA256 }}``
            Unsigned binary => SmartScreen warns; that is normal, not a virus.
            Public scan: https://www.virustotal.com (paste the file or hash).
            Reproducible: clone this repo at tag ${{ github.ref_name || github.sha }} and run npm ci && npm run dist.
