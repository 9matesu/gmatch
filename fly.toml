app = "goongrid-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[mounts]
  source = "goongrid_data"
  destination = "/data"

[env]
  PORT = "8080"
  SNAPSHOT_PATH = "/data/orbit.sqlite"
  BLOB_STORE_DIR = "/data/blobs"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http", "websocket"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    http_path = "/api/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
